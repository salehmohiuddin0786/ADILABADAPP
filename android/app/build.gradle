plugins {
    id 'com.android.application'
}

android {
    namespace 'in.digitalcrowdtech.adilabad'
    compileSdk 34

    defaultConfig {
        applicationId "in.digitalcrowdtech.adilabad"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "adilabad.digitalcrowdtech.in",
            defaultUrl: "https://adilabad.digitalcrowdtech.in/?source=twa",
            appName: "Adilabad App",
            launcherName: "Adilabad App"
        ]
    }

    signingConfigs {
        release {
            storeFile file('../../adilabad-release-key.jks')
            storePassword 'AdilabadApp@2026'
            keyAlias 'adilabad'
            keyPassword 'AdilabadApp@2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
